<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh Giá Dịch Vụ Khách Hàng</title>
    <!-- Nhúng Tailwind CSS & FontAwesome Icons qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 sm:p-8">

    <!-- Header -->
    <div class="text-center mb-6">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
            <i class="fa-solid fa-comments"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Ý kiến của bạn</h2>
        <p class="text-slate-500 text-sm mt-1">Trải nghiệm dịch vụ của bạn hôm nay thế nào?</p>
    </div>

    <!-- Form -->
    <form id="feedbackForm" onsubmit="handleSubmit(event)" class="space-y-5">

        <!-- Đánh giá bằng sao -->
        <div class="text-center">
            <label class="block text-sm font-medium text-slate-700 mb-2">Đánh giá chung</label>
            <div class="flex justify-center space-x-2 text-3xl text-slate-300 cursor-pointer" id="starRating">
                <i class="fa-solid fa-star transition hover:text-amber-400" data-value="1"></i>
                <i class="fa-solid fa-star transition hover:text-amber-400" data-value="2"></i>
                <i class="fa-solid fa-star transition hover:text-amber-400" data-value="3"></i>
                <i class="fa-solid fa-star transition hover:text-amber-400" data-value="4"></i>
                <i class="fa-solid fa-star transition hover:text-amber-400" data-value="5"></i>
            </div>
        </div>

        <!-- Thẻ gợi ý (Checkboxes) -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Điều gì làm bạn ấn tượng?</label>
            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition text-xs font-medium text-slate-600">
                    <input type="checkbox" value="Chất lượng tốt" class="mr-2 text-indigo-600 rounded focus:ring-0">
                    Chất lượng tốt
                </label>
                <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition text-xs font-medium text-slate-600">
                    <input type="checkbox" value="Phục vụ nhanh" class="mr-2 text-indigo-600 rounded focus:ring-0">
                    Phục vụ nhanh
                </label>
                <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition text-xs font-medium text-slate-600">
                    <input type="checkbox" value="Thái độ thân thiện" class="mr-2 text-indigo-600 rounded focus:ring-0">
                    Thái độ thân thiện
                </label>
                <label class="flex items-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition text-xs font-medium text-slate-600">
                    <input type="checkbox" value="Giá cả hợp lý" class="mr-2 text-indigo-600 rounded focus:ring-0">
                    Giá cả hợp lý
                </label>
            </div>
        </div>

        <!-- Khung phản hồi chi tiết -->
        <div>
            <label for="comment" class="block text-sm font-medium text-slate-700 mb-1">Đóng góp ý kiến thêm</label>
            <textarea id="comment" rows="3" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Chia sẻ thêm trải nghiệm của bạn..."></textarea>
        </div>

        <!-- Button Submit -->
        <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition duration-200">
            Gửi phản hồi
        </button>
    </form>

    <!-- Màn hình thông báo thành công (Ẩn mặc định) -->
    <div id="successMessage" class="hidden text-center py-6">
        <i class="fa-solid fa-circle-check text-5xl text-emerald-500 mb-3"></i>
        <h3 class="text-xl font-bold text-slate-800">Cảm ơn bạn!</h3>
        <p class="text-slate-500 text-sm mt-1">Phản hồi của bạn đã được ghi nhận thành công.</p>
    </div>

</div>

<!-- Script xử lý tương tác -->
<script>
    let currentRating = 0;
    const stars = document.querySelectorAll('#starRating i');

    // Xử lý chọn sao
    stars.forEach((star, index) => {
        star.addEventListener('click', () => {
            currentRating = index + 1;
            updateStars();
        });
    });

    function updateStars() {
        stars.forEach((star, index) => {
            if (index < currentRating) {
                star.classList.add('text-amber-400');
                star.classList.remove('text-slate-300');
            } else {
                star.classList.remove('text-amber-400');
                star.classList.add('text-slate-300');
            }
        });
    }

    // Xử lý submit form
    function handleSubmit(event) {
        event.preventDefault();
        if (currentRating === 0) {
            alert('Vui lòng chọn số sao đánh giá!');
            return;
        }

        // Mở màn hình thành công
        document.getElementById('feedbackForm').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');
    }
</script>
</body>
</html>
